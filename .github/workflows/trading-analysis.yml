name: TradingAgents Daily Analysis

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers; empty = default watchlist"
        required: false
        default: ""

      analysis_date:
        description: "YYYY-MM-DD; empty = current date in New York"
        required: false
        default: ""

      force_run:
        description: "Run even if not an NYSE trading day"
        required: false
        type: boolean
        default: false

      notify:
        description: "Send Gmail and DingTalk notifications"
        required: false
        type: boolean
        default: true

  # v0.9:
  # Five static post-market batches, Monday-Friday, New York time.
  # Change batch START TIMES here in YAML.
  # Change batch TICKERS / ENABLED batches in Repository Variables.
  schedule:
    - cron: "20 17 * * 1"
      timezone: "America/New_York"

    - cron: "20 17 * * 2"
      timezone: "America/New_York"

    - cron: "20 17 * * 3"
      timezone: "America/New_York"

    - cron: "20 17 * * 4"
      timezone: "America/New_York"

    - cron: "20 17 * * 5"
      timezone: "America/New_York"


permissions:
  contents: read


concurrency:
  # Different cron schedules get different concurrency groups.
  # This prevents a long Batch N run from replacing another batch's pending run.
  # Manual runs use github.run_id and therefore do not block scheduled batches.
  group: tradingagents-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false


jobs:

  # ============================================================
  # 1. PREPARE
  # ============================================================

  prepare:
    name: Prepare

    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      analysis_date: ${{ steps.prepare.outputs.analysis_date }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      batch_id: ${{ steps.prepare.outputs.batch_id }}
      batch_schedule: ${{ steps.prepare.outputs.batch_schedule }}

      llm_provider: ${{ steps.llm.outputs.llm_provider }}
      quick_model: ${{ steps.llm.outputs.quick_model }}
      deep_model: ${{ steps.llm.outputs.deep_model }}
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NYSE calendar
        run: |
          python -m pip install --upgrade pip
          pip install pandas_market_calendars

      - name: Build ticker matrix
        id: prepare

        shell: python

        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}

          MANUAL_TICKERS: ${{ github.event.inputs.tickers }}
          MANUAL_DATE: ${{ github.event.inputs.analysis_date }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}

          TRADING_BATCHES_ENABLED: ${{ vars.TRADING_BATCHES_ENABLED }}

          TRADING_BATCH_1_TICKERS: ${{ vars.TRADING_BATCH_1_TICKERS }}
          TRADING_BATCH_2_TICKERS: ${{ vars.TRADING_BATCH_2_TICKERS }}
          TRADING_BATCH_3_TICKERS: ${{ vars.TRADING_BATCH_3_TICKERS }}
          TRADING_BATCH_4_TICKERS: ${{ vars.TRADING_BATCH_4_TICKERS }}
          TRADING_BATCH_5_TICKERS: ${{ vars.TRADING_BATCH_5_TICKERS }}

        run: |
          import json
          import os

          from datetime import datetime
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal


          DEFAULT_TICKERS = [
              "VOO",
              "QQQM",
              "MSTR",
              "PDD",
          ]


          SCHEDULE_TO_BATCH = {
              "20 17 * * 1-5": "1",
              "20 18 * * 1-5": "2",
              "20 19 * * 1-5": "3",
              "20 20 * * 1-5": "4",
              "20 21 * * 1-5": "5",
          }


          BATCH_TICKER_ENV = {
              "1": "TRADING_BATCH_1_TICKERS",
              "2": "TRADING_BATCH_2_TICKERS",
              "3": "TRADING_BATCH_3_TICKERS",
              "4": "TRADING_BATCH_4_TICKERS",
              "5": "TRADING_BATCH_5_TICKERS",
          }


          def parse_tickers(raw_value):
              seen = set()
              result = []

              for item in raw_value.split(","):
                  ticker = item.strip().upper()

                  if not ticker:
                      continue

                  if ticker in seen:
                      continue

                  seen.add(ticker)
                  result.append(ticker)

              return result


          def parse_enabled_batches(raw_value):
              value = raw_value.strip().lower()

              if value in ("", "none"):
                  return set()

              if value == "all":
                  return {"1", "2", "3", "4", "5"}

              enabled = {
                  item.strip()
                  for item
                  in value.split(",")
                  if item.strip()
              }

              invalid = sorted(
                  item
                  for item
                  in enabled
                  if item not in {"1", "2", "3", "4", "5"}
              )

              if invalid:
                  raise SystemExit(
                      "TRADING_BATCHES_ENABLED contains invalid "
                      f"batch id(s): {invalid}. "
                      "Use all, none, or comma-separated values 1-5."
                  )

              return enabled


          event_name = os.getenv(
              "EVENT_NAME",
              "",
          ).strip()

          event_schedule = os.getenv(
              "EVENT_SCHEDULE",
              "",
          ).strip()

          manual_tickers = os.getenv(
              "MANUAL_TICKERS",
              "",
          ).strip()

          manual_date = os.getenv(
              "MANUAL_DATE",
              "",
          ).strip()

          force_run = (
              os.getenv(
                  "FORCE_RUN",
                  "false",
              ).lower()
              == "true"
          )


          if manual_date:
              analysis_date = manual_date
          else:
              analysis_date = (
                  datetime.now(
                      ZoneInfo(
                          "America/New_York"
                      )
                  ).strftime(
                      "%Y-%m-%d"
                  )
              )


          nyse = mcal.get_calendar(
              "NYSE"
          )

          market_schedule = (
              nyse.schedule(
                  start_date=analysis_date,
                  end_date=analysis_date,
              )
          )

          is_trading_day = (
              not market_schedule.empty
          )


          if event_name == "schedule":
              batch_id = SCHEDULE_TO_BATCH.get(
                  event_schedule
              )

              if not batch_id:
                  raise SystemExit(
                      "Unsupported scheduled trigger: "
                      f"{event_schedule!r}"
                  )

              enabled_batches = parse_enabled_batches(
                  os.getenv(
                      "TRADING_BATCHES_ENABLED",
                      "none",
                  )
              )

              ticker_env_name = (
                  BATCH_TICKER_ENV[
                      batch_id
                  ]
              )

              tickers = parse_tickers(
                  os.getenv(
                      ticker_env_name,
                      "",
                  )
              )

              batch_enabled = (
                  batch_id
                  in enabled_batches
              )

              should_run = (
                  is_trading_day
                  and batch_enabled
                  and bool(tickers)
              )

              batch_schedule = (
                  event_schedule
              )

              if not batch_enabled:
                  print(
                      "Scheduled batch is disabled: "
                      f"Batch {batch_id}"
                  )

              if batch_enabled and not tickers:
                  print(
                      "::warning::"
                      f"{ticker_env_name} is empty; "
                      f"Batch {batch_id} will be skipped."
                  )

          elif event_name == "workflow_dispatch":
              batch_id = "manual"
              batch_schedule = "manual"

              if manual_tickers:
                  tickers = parse_tickers(
                      manual_tickers
                  )
              else:
                  tickers = (
                      DEFAULT_TICKERS
                  )

              if force_run:
                  should_run = True
              else:
                  should_run = (
                      is_trading_day
                  )

          else:
              raise SystemExit(
                  "Unsupported GitHub event: "
                  f"{event_name!r}"
              )


          matrix = {
              "ticker": tickers,
          }


          print(
              f"Event name: "
              f"{event_name}"
          )

          print(
              f"Event schedule: "
              f"{event_schedule or 'N/A'}"
          )

          print(
              f"Batch ID: "
              f"{batch_id}"
          )

          print(
              f"Batch schedule: "
              f"{batch_schedule}"
          )

          print(
              f"Analysis date: "
              f"{analysis_date}"
          )

          print(
              f"NYSE trading day: "
              f"{is_trading_day}"
          )

          print(
              f"Should run: "
              f"{should_run}"
          )

          print(
              f"Tickers: "
              f"{tickers}"
          )


          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a",
              encoding="utf-8",
          ) as output_file:
              output_file.write(
                  f"analysis_date="
                  f"{analysis_date}\n"
              )

              output_file.write(
                  f"should_run="
                  f"{str(should_run).lower()}\n"
              )

              output_file.write(
                  "matrix="
                  + json.dumps(
                      matrix
                  )
                  + "\n"
              )

              output_file.write(
                  f"batch_id="
                  f"{batch_id}\n"
              )

              output_file.write(
                  f"batch_schedule="
                  f"{batch_schedule}\n"
              )


      - name: Resolve LLM configuration
        id: llm
        if: steps.prepare.outputs.should_run == 'true'
        shell: python

        env:
          ZHIPU_CN_API_KEY: ${{ secrets.ZHIPU_CN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        run: |
          import os


          zhipu_key = os.environ.get(
              "ZHIPU_CN_API_KEY",
              "",
          ).strip()

          deepseek_key = os.environ.get(
              "DEEPSEEK_API_KEY",
              "",
          ).strip()


          if zhipu_key:
              provider = "glm-cn"
              quick_model = "glm-5.3-flash"
              deep_model = "glm-5.3-flash"
              credential = "ZHIPU_CN_API_KEY"

          elif deepseek_key:
              provider = "deepseek"
              quick_model = "deepseek-v4-flash"
              deep_model = "deepseek-v4-pro"
              credential = "DEEPSEEK_API_KEY"

          else:
              raise SystemExit(
                  "No supported LLM API key is configured. "
                  "Set ZHIPU_CN_API_KEY or DEEPSEEK_API_KEY."
              )


          print(
              f"Selected provider: {provider}"
          )

          print(
              f"Quick model: {quick_model}"
          )

          print(
              f"Deep model: {deep_model}"
          )

          print(
              f"Credential source: {credential}"
          )


          output_path = os.environ[
              "GITHUB_OUTPUT"
          ]

          with open(
              output_path,
              "a",
              encoding="utf-8",
          ) as output_file:
              output_file.write(
                  f"llm_provider={provider}\n"
              )

              output_file.write(
                  f"quick_model={quick_model}\n"
              )

              output_file.write(
                  f"deep_model={deep_model}\n"
              )

  # ============================================================
  # 2. ANALYZE
  # ============================================================

  analyze:
    name: Analyze ${{ matrix.ticker }}

    needs:
      - prepare

    if: needs.prepare.outputs.should_run == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 330

    strategy:
      fail-fast: false

      # 初始建议同时最多跑 3 个 ticker
      max-parallel: 3

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      # --------------------------------------------------------
      # DeepSeek
      #
      # IMPORTANT:
      # 不要改成：
      #
      # DEEPSEEK_API_KEY: >
      #   ${{ secrets.DEEPSEEK_API_KEY }}
      #
      # Secret 必须保持单行。
      #
      # LLM credentials
      #
      # 两个映射都长期保留。
      # Repository Secret 不存在时，其值为空字符串。
      # Prepare job 会自动选择可用 provider。
      # --------------------------------------------------------

      ZHIPU_CN_API_KEY: ${{ secrets.ZHIPU_CN_API_KEY }}
      
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # --------------------------------------------------------
      # LLM configuration
      #
      # 注意：
      # 不再硬编码 DeepSeek。
      # 全部使用 Prepare job 的选择结果。
      # --------------------------------------------------------

      TRADINGAGENTS_LLM_PROVIDER: ${{ needs.prepare.outputs.llm_provider }}

      TRADINGAGENTS_QUICK_THINK_LLM: ${{ needs.prepare.outputs.quick_model }}

      TRADINGAGENTS_DEEP_THINK_LLM: ${{ needs.prepare.outputs.deep_model }}

      TRADINGAGENTS_OUTPUT_LANGUAGE: Chinese

      TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"

      TRADINGAGENTS_MAX_RISK_ROUNDS: "1"

      TRADINGAGENTS_CHECKPOINT_ENABLED: "true"

      TRADINGAGENTS_LLM_MAX_RETRIES: "3"


    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"
          cache: "pip"


      # --------------------------------------------------------
      # Install
      # --------------------------------------------------------

      - name: Install TradingAgents
        run: |
          python -m pip install --upgrade pip
          pip install .


      # --------------------------------------------------------
      # Validate DeepSeek Secret
      #
      # 不打印 Key 本身。
      # 只检查：
      # - 是否为空
      # - 首尾空格
      # - CR / LF / TAB
      #
      # 这一步用于提前阻止：
      #
      # LocalProtocolError:
      # Illegal header value
      # --------------------------------------------------------

      - name: Validate selected LLM configuration
        shell: python

        env:
          SELECTED_PROVIDER: ${{ needs.prepare.outputs.llm_provider }}

          SELECTED_QUICK_MODEL: ${{ needs.prepare.outputs.quick_model }}

          SELECTED_DEEP_MODEL: ${{ needs.prepare.outputs.deep_model }}

          ZHIPU_CN_API_KEY: ${{ secrets.ZHIPU_CN_API_KEY }}

          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        run: |
          import os


          provider = os.environ.get(
              "SELECTED_PROVIDER",
              "",
          ).strip()

          quick_model = os.environ.get(
              "SELECTED_QUICK_MODEL",
              "",
          ).strip()

          deep_model = os.environ.get(
              "SELECTED_DEEP_MODEL",
              "",
          ).strip()


          key_mapping = {
              "glm-cn": "ZHIPU_CN_API_KEY",
              "deepseek": "DEEPSEEK_API_KEY",
          }


          key_name = key_mapping.get(
              provider
          )


          if not key_name:
              raise SystemExit(
                  "Unsupported LLM provider: "
                  f"{provider}"
              )


          key = os.environ.get(
              key_name,
              "",
          )


          if not key:
              raise SystemExit(
                  f"{key_name} is empty or missing."
              )


          if key != key.strip():
              raise SystemExit(
                  f"{key_name} contains leading "
                  "or trailing whitespace."
              )


          illegal_chars = [
              char
              for char in (
                  "\r",
                  "\n",
                  "\t",
              )
              if char in key
          ]


          if illegal_chars:
              raise SystemExit(
                  f"{key_name} contains "
                  "CR/LF/TAB characters."
              )


          print(
              f"Provider: {provider}"
          )

          print(
              f"Quick model: {quick_model}"
          )

          print(
              f"Deep model: {deep_model}"
          )

          print(
              f"{key_name}: OK"
          )


      # --------------------------------------------------------
      # Restore per-ticker memory/cache
      # --------------------------------------------------------

      - name: Restore ticker state
        uses: actions/cache@v5

        with:
          path: state/${{ matrix.ticker }}

          key: tradingagents-state-${{ matrix.ticker }}-${{ needs.prepare.outputs.analysis_date }}-${{ github.run_id }}

          restore-keys: |
            tradingagents-state-${{ matrix.ticker }}-


      # --------------------------------------------------------
      # Prepare local state folders
      # --------------------------------------------------------

      - name: Prepare state
        run: |
          mkdir -p \
            "state/${{ matrix.ticker }}/cache" \
            "state/${{ matrix.ticker }}/memory" \
            "state/${{ matrix.ticker }}/logs"


      # --------------------------------------------------------
      # Run TradingAgents
      #
      # IMPORTANT:
      # 这里也不使用 YAML >
      # 避免路径尾部进入换行符。
      # --------------------------------------------------------

      - name: Run analysis
        env:
          TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/state/${{ matrix.ticker }}/cache

          TRADINGAGENTS_MEMORY_LOG_PATH: ${{ github.workspace }}/state/${{ matrix.ticker }}/memory/trading_memory.md

          TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/state/${{ matrix.ticker }}/logs

        run: |
          python scripts/run_headless_analysis.py \
            --ticker "${{ matrix.ticker }}" \
            --date "${{ needs.prepare.outputs.analysis_date }}" \
            --output-dir "reports"


      # --------------------------------------------------------
      # Upload ticker report
      #
      # always():
      # 即使 TradingAgents 分析失败，
      # metadata.json / error.txt 仍然上传，
      # 方便排障。
      # --------------------------------------------------------

      - name: Upload report
        if: always()

        uses: actions/upload-artifact@v6

        with:
          name: report-${{ needs.prepare.outputs.batch_id }}-${{ matrix.ticker }}-${{ needs.prepare.outputs.analysis_date }}

          path: reports/${{ matrix.ticker }}/

          if-no-files-found: warn

          retention-days: 30

  # ============================================================
  # 3. AGGREGATE + B2 + NOTIFY
  # ============================================================

  notify:
    name: Aggregate & Notify

    needs:
      - prepare
      - analyze

    # 即使某一只股票分析失败，
    # 仍然执行汇总。
    if: always() && needs.prepare.outputs.should_run == 'true'

    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # 下载全部股票 Artifact
      # --------------------------------------------------------

      - name: Download ticker reports
        uses: actions/download-artifact@v8

        with:
          pattern: report-*

          path: collected-reports

          merge-multiple: false


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # 通知依赖
      # --------------------------------------------------------

      - name: Install notification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # --------------------------------------------------------
      # 检查 AWS CLI
      #
      # Backblaze B2 使用 S3-Compatible API，
      # 因此直接使用 AWS CLI。
      # --------------------------------------------------------

      - name: Check AWS CLI
        run: |
          aws --version


      # --------------------------------------------------------
      # 上传 TradingAgents 报告到 Backblaze B2
      #
      # GitHub Secret:
      #   B2_KEY_ID
      #       ↓
      #   AWS_ACCESS_KEY_ID
      #
      #   B2_APPLICATION_KEY
      #       ↓
      #   AWS_SECRET_ACCESS_KEY
      #
      # 注意：
      # Secret 只暴露给这个 step，
      # 不设置为整个 job 的环境变量。
      # --------------------------------------------------------

      - name: Archive reports to Backblaze B2

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}

          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}

          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}

          B2_BUCKET: ${{ secrets.B2_BUCKET }}

          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

          B2_REGION: ${{ secrets.B2_REGION }}

          ANALYSIS_DATE: ${{ needs.prepare.outputs.analysis_date }}

        run: |
          set -euo pipefail

          echo "Preparing Backblaze B2 archive..."

          if [ -z "${B2_BUCKET}" ]; then
            echo "::error::B2_BUCKET is empty."
            exit 1
          fi

          if [ -z "${B2_ENDPOINT}" ]; then
            echo "::error::B2_ENDPOINT is empty."
            exit 1
          fi

          if [ -z "${B2_REGION}" ]; then
            echo "::error::B2_REGION is empty."
            exit 1
          fi

          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::error::B2_KEY_ID is empty."
            exit 1
          fi

          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::B2_APPLICATION_KEY is empty."
            exit 1
          fi

          YEAR="${ANALYSIS_DATE:0:4}"
          MONTH="${ANALYSIS_DATE:5:2}"

          DESTINATION="s3://${B2_BUCKET}/tradingagents/reports/${YEAR}/${MONTH}/${ANALYSIS_DATE}/"

          echo "Analysis date: ${ANALYSIS_DATE}"
          echo "B2 region: ${B2_REGION}"
          echo "B2 destination: ${DESTINATION}"

          aws s3 sync \
            "collected-reports/" \
            "${DESTINATION}" \
            --endpoint-url "${B2_ENDPOINT}" \
            --region "${B2_REGION}" \
            --only-show-errors

          echo "Backblaze B2 archive completed."


      # --------------------------------------------------------
      # Gmail + DingTalk
      #
      # schedule:
      #   自动发送
      #
      # workflow_dispatch:
      #   notify=true 时发送
      # --------------------------------------------------------

      - name: Send Gmail and DingTalk

        if: github.event_name == 'schedule' || github.event.inputs.notify == 'true'

        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}

          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}

          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}

          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}

        run: |
          python scripts/notify_reports.py


      # --------------------------------------------------------
      # GitHub Artifact 继续保留
      # --------------------------------------------------------

      - name: Upload combined reports
        if: always()

        uses: actions/upload-artifact@v6

        with:
          name: all-reports-${{ needs.prepare.outputs.batch_id }}-${{ needs.prepare.outputs.analysis_date }}

          path: |
            collected-reports/
            notification-output/

          if-no-files-found: warn

          retention-days: 30
