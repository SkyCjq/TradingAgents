name: TradingAgents Daily Analysis

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers; empty = default watchlist"
        required: false
        default: ""

      analysis_date:
        description: "YYYY-MM-DD; empty = current date in New York"
        required: false
        default: ""

      force_run:
        description: "Run even if not an NYSE trading day"
        required: false
        type: boolean
        default: false

      notify:
        description: "Send Gmail and DingTalk notifications"
        required: false
        type: boolean
        default: true

  schedule:
    - cron: "15 17 * * 4"
      timezone: "America/New_York"


permissions:
  contents: read


concurrency:
  group: tradingagents-daily-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ============================================================
  # 1. PREPARE
  # ============================================================

  prepare:
    name: Prepare

    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      analysis_date: ${{ steps.prepare.outputs.analysis_date }}
      matrix: ${{ steps.prepare.outputs.matrix }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NYSE calendar
        run: |
          python -m pip install --upgrade pip
          pip install pandas_market_calendars

      - name: Build ticker matrix
        id: prepare

        shell: python

        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TICKERS: ${{ github.event.inputs.tickers }}
          MANUAL_DATE: ${{ github.event.inputs.analysis_date }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}

        run: |
          import json
          import os

          from datetime import datetime
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal


          DEFAULT_TICKERS = [
              "VOO",
              "QQQM",
              "MSTR",
              "PDD",
          ]


          event_name = os.getenv(
              "EVENT_NAME",
              "",
          )

          manual_tickers = os.getenv(
              "MANUAL_TICKERS",
              "",
          ).strip()

          manual_date = os.getenv(
              "MANUAL_DATE",
              "",
          ).strip()

          force_run = (
              os.getenv(
                  "FORCE_RUN",
                  "false",
              ).lower()
              == "true"
          )


          if manual_tickers:
              tickers = [
                  item.strip().upper()
                  for item
                  in manual_tickers.split(",")
                  if item.strip()
              ]
          else:
              tickers = DEFAULT_TICKERS


          if manual_date:
              analysis_date = (
                  manual_date
              )
          else:
              analysis_date = (
                  datetime.now(
                      ZoneInfo(
                          "America/New_York"
                      )
                  ).strftime(
                      "%Y-%m-%d"
                  )
              )


          nyse = mcal.get_calendar(
              "NYSE"
          )

          market_schedule = (
              nyse.schedule(
                  start_date=analysis_date,
                  end_date=analysis_date,
              )
          )

          is_trading_day = (
              not market_schedule.empty
          )


          if (
              event_name
              == "workflow_dispatch"
              and force_run
          ):
              should_run = True
          else:
              should_run = (
                  is_trading_day
              )


          matrix = {
              "ticker": tickers,
          }


          print(
              f"Analysis date: "
              f"{analysis_date}"
          )

          print(
              f"NYSE trading day: "
              f"{is_trading_day}"
          )

          print(
              f"Should run: "
              f"{should_run}"
          )

          print(
              f"Tickers: "
              f"{tickers}"
          )


          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a",
              encoding="utf-8",
          ) as output_file:
              output_file.write(
                  f"analysis_date="
                  f"{analysis_date}\n"
              )

              output_file.write(
                  f"should_run="
                  f"{str(should_run).lower()}\n"
              )

              output_file.write(
                  "matrix="
                  + json.dumps(
                      matrix
                  )
                  + "\n"
              )


  # ============================================================
  # 2. ANALYZE
  # ============================================================

  analyze:
    name: Analyze ${{ matrix.ticker }}

    needs:
      - prepare

    if: needs.prepare.outputs.should_run == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 330

    strategy:
      fail-fast: false

      # 初始建议同时最多跑 3 个 ticker
      max-parallel: 3

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      # --------------------------------------------------------
      # DeepSeek
      #
      # IMPORTANT:
      # 不要改成：
      #
      # DEEPSEEK_API_KEY: >
      #   ${{ secrets.DEEPSEEK_API_KEY }}
      #
      # Secret 必须保持单行。
      # --------------------------------------------------------

      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      TRADINGAGENTS_LLM_PROVIDER: deepseek

      TRADINGAGENTS_QUICK_THINK_LLM: deepseek-v4-flash

      TRADINGAGENTS_DEEP_THINK_LLM: deepseek-v4-pro

      TRADINGAGENTS_OUTPUT_LANGUAGE: Chinese

      TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"

      TRADINGAGENTS_MAX_RISK_ROUNDS: "1"

      TRADINGAGENTS_CHECKPOINT_ENABLED: "true"

      TRADINGAGENTS_LLM_MAX_RETRIES: "3"


    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"
          cache: "pip"


      # --------------------------------------------------------
      # Install
      # --------------------------------------------------------

      - name: Install TradingAgents
        run: |
          python -m pip install --upgrade pip
          pip install .


      # --------------------------------------------------------
      # Validate DeepSeek Secret
      #
      # 不打印 Key 本身。
      # 只检查：
      # - 是否为空
      # - 首尾空格
      # - CR / LF / TAB
      #
      # 这一步用于提前阻止：
      #
      # LocalProtocolError:
      # Illegal header value
      # --------------------------------------------------------

      - name: Validate DeepSeek configuration
        shell: python

        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        run: |
          import os


          key = os.environ.get(
              "DEEPSEEK_API_KEY",
              "",
          )


          if not key:
              raise SystemExit(
                  "DEEPSEEK_API_KEY "
                  "is empty or missing."
              )


          if key != key.strip():
              raise SystemExit(
                  "DEEPSEEK_API_KEY "
                  "contains leading or "
                  "trailing whitespace."
              )


          illegal_chars = [
              char
              for char in (
                  "\r",
                  "\n",
                  "\t",
              )
              if char in key
          ]


          if illegal_chars:
              raise SystemExit(
                  "DEEPSEEK_API_KEY "
                  "contains CR/LF/TAB "
                  "characters."
              )


          print(
              "DeepSeek secret OK. "
              f"Length={len(key)}"
          )


      # --------------------------------------------------------
      # Restore per-ticker memory/cache
      # --------------------------------------------------------

      - name: Restore ticker state
        uses: actions/cache@v5

        with:
          path: state/${{ matrix.ticker }}

          key: tradingagents-state-${{ matrix.ticker }}-${{ needs.prepare.outputs.analysis_date }}-${{ github.run_id }}

          restore-keys: |
            tradingagents-state-${{ matrix.ticker }}-


      # --------------------------------------------------------
      # Prepare local state folders
      # --------------------------------------------------------

      - name: Prepare state
        run: |
          mkdir -p \
            "state/${{ matrix.ticker }}/cache" \
            "state/${{ matrix.ticker }}/memory" \
            "state/${{ matrix.ticker }}/logs"


      # --------------------------------------------------------
      # Run TradingAgents
      #
      # IMPORTANT:
      # 这里也不使用 YAML >
      # 避免路径尾部进入换行符。
      # --------------------------------------------------------

      - name: Run analysis
        env:
          TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/state/${{ matrix.ticker }}/cache

          TRADINGAGENTS_MEMORY_LOG_PATH: ${{ github.workspace }}/state/${{ matrix.ticker }}/memory/trading_memory.md

          TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/state/${{ matrix.ticker }}/logs

        run: |
          python scripts/run_headless_analysis.py \
            --ticker "${{ matrix.ticker }}" \
            --date "${{ needs.prepare.outputs.analysis_date }}" \
            --output-dir "reports"


      # --------------------------------------------------------
      # Upload ticker report
      #
      # always():
      # 即使 TradingAgents 分析失败，
      # metadata.json / error.txt 仍然上传，
      # 方便排障。
      # --------------------------------------------------------

      - name: Upload report
        if: always()

        uses: actions/upload-artifact@v6

        with:
          name: report-${{ matrix.ticker }}-${{ needs.prepare.outputs.analysis_date }}

          path: reports/${{ matrix.ticker }}/

          if-no-files-found: warn

          retention-days: 30

  # ============================================================
  # 3. AGGREGATE + B2 + NOTIFY
  # ============================================================

  notify:
    name: Aggregate & Notify

    needs:
      - prepare
      - analyze

    # 即使某一只股票分析失败，
    # 仍然执行汇总。
    if: always() && needs.prepare.outputs.should_run == 'true'

    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # 下载全部股票 Artifact
      # --------------------------------------------------------

      - name: Download ticker reports
        uses: actions/download-artifact@v8

        with:
          pattern: report-*

          path: collected-reports

          merge-multiple: false


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # 通知依赖
      # --------------------------------------------------------

      - name: Install notification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # --------------------------------------------------------
      # 检查 AWS CLI
      #
      # Backblaze B2 使用 S3-Compatible API，
      # 因此直接使用 AWS CLI。
      # --------------------------------------------------------

      - name: Check AWS CLI
        run: |
          aws --version


      # --------------------------------------------------------
      # 上传 TradingAgents 报告到 Backblaze B2
      #
      # GitHub Secret:
      #   B2_KEY_ID
      #       ↓
      #   AWS_ACCESS_KEY_ID
      #
      #   B2_APPLICATION_KEY
      #       ↓
      #   AWS_SECRET_ACCESS_KEY
      #
      # 注意：
      # Secret 只暴露给这个 step，
      # 不设置为整个 job 的环境变量。
      # --------------------------------------------------------

      - name: Archive reports to Backblaze B2

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}

          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}

          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}

          B2_BUCKET: ${{ secrets.B2_BUCKET }}

          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

          B2_REGION: ${{ secrets.B2_REGION }}

          ANALYSIS_DATE: ${{ needs.prepare.outputs.analysis_date }}

        run: |
          set -euo pipefail

          echo "Preparing Backblaze B2 archive..."

          if [ -z "${B2_BUCKET}" ]; then
            echo "::error::B2_BUCKET is empty."
            exit 1
          fi

          if [ -z "${B2_ENDPOINT}" ]; then
            echo "::error::B2_ENDPOINT is empty."
            exit 1
          fi

          if [ -z "${B2_REGION}" ]; then
            echo "::error::B2_REGION is empty."
            exit 1
          fi

          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::error::B2_KEY_ID is empty."
            exit 1
          fi

          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::B2_APPLICATION_KEY is empty."
            exit 1
          fi

          YEAR="${ANALYSIS_DATE:0:4}"
          MONTH="${ANALYSIS_DATE:5:2}"

          DESTINATION="s3://${B2_BUCKET}/tradingagents/reports/${YEAR}/${MONTH}/${ANALYSIS_DATE}/"

          echo "Analysis date: ${ANALYSIS_DATE}"
          echo "B2 region: ${B2_REGION}"
          echo "B2 destination: ${DESTINATION}"

          aws s3 sync \
            "collected-reports/" \
            "${DESTINATION}" \
            --endpoint-url "${B2_ENDPOINT}" \
            --region "${B2_REGION}" \
            --only-show-errors

          echo "Backblaze B2 archive completed."


      # --------------------------------------------------------
      # Gmail + DingTalk
      #
      # schedule:
      #   自动发送
      #
      # workflow_dispatch:
      #   notify=true 时发送
      # --------------------------------------------------------

      - name: Send Gmail and DingTalk

        if: github.event_name == 'schedule' || github.event.inputs.notify == 'true'

        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}

          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}

          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}

          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}

        run: |
          python scripts/notify_reports.py


      # --------------------------------------------------------
      # GitHub Artifact 继续保留
      # --------------------------------------------------------

      - name: Upload combined reports
        if: always()

        uses: actions/upload-artifact@v6

        with:
          name: all-reports-${{ needs.prepare.outputs.analysis_date }}

          path: |
            collected-reports/
            notification-output/

          if-no-files-found: warn

          retention-days: 30
